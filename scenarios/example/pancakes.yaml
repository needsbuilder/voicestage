name: Pancakes and a timer
description: >
  Find a recipe (progress notifications, default card), start a timer without
  saying how long (the server asks by form elicitation, MCP Apps card), and
  hear the timer finish (proactive announcement from a server-sent event).
config: ../../voicestage.config.yaml

steps:
  - device: display
    say: "How do I make pancakes?"
    # What the assistant does when no model is driving (scripted mode).
    script:
      - skill: kitchen-helper
      - call: find_recipe
        args: { dish: pancakes }
        save: recipe
      - say: "{{recipe.say_to_user}}"
    expect:
      - tool: find_recipe
        args: { dish: { contains: pancake } }
        result: { title: Pancakes, serves: 4 }
      - screen: default
      - said: "20 minutes"

  - device: display
    say: "Set a timer for the pancakes."
    # The server asks "How long should the timer run?". This is the answer.
    when_asked: "Three seconds"
    script:
      - call: start_timer
        args: { label: pancakes }
        save: timer
      - say: "{{timer.say_to_user}}"
    expect:
      - asked: "How long"
      - tool: start_timer
        result: { label: pancakes, seconds: 3, status: running }
      - screen: ui://example/timer-card.html

  - device: display
    wait_for: { event: timer.done, timeout: 10 }
    expect:
      - announced: "timer is done"
